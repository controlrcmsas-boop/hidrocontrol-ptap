# fly.toml app configuration file generated for hidrocontrol-ptap
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'hidrocontrol-ptap'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://+:8080'
  HostSettings__PublicDomain = 'https://hidrocontrol.potenzia.app'
  Auth__DbPath = '/data/hidrocontrol-auth.db'
  TYPESAFE_API_KEY = 'apikey_253086703297f524d75b2452dcae9ba372f_465221ede5583ab8863220110d5525c83bfe7e86a17553ea1677f20af4427269'


[mounts]
  source = 'hidrocontrol_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
