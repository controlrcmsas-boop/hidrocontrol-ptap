# fly.toml app configuration file generated for hidrocontrol-ptap
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'hidrocontrol-ptap'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://+:8080'
  HostSettings__PublicDomain = 'https://hidrocontrol.potenzia.app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
